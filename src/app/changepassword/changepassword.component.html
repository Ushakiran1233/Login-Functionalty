<div class="change-password-wrapper">
  <div class="change-password-card">

    <h2>Change Password</h2>
    <p class="subtitle">Update your account password</p>

    <!-- Success Message -->
    <div *ngIf="successMessage" class="alert success">
      {{ successMessage }}
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="alert error">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="changePassword()" #form="ngForm" novalidate>

      <!-- Current Password -->
      <div class="form-group">
        <label for="currentPassword">Current Password</label>
        <input
          type="password"
          id="currentPassword"
          name="currentPassword"
          required
          minlength="8"
          [(ngModel)]="model.CurrentPassword"
          #currentPassword="ngModel"
          placeholder="Enter current password"
        />
        <small class="error"
               *ngIf="currentPassword.touched && currentPassword.invalid">
          Current password is required (minimum 8 characters)
        </small>
      </div>

      <!-- New Password -->
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input
          type="password"
          id="newPassword"
          name="newPassword"
          #newPassword="ngModel"
          required
          minlength="8"
          pattern="^[A-Z](?=.*[a-zA-Z])(?=.*[0-9])(?=.*[@$!%*?&])[A-Za-z0-9@$!%*?&]{7,}$"
          [(ngModel)]="model.NewPassword"
          placeholder="Enter new password"
        />
        <small class="error"
               *ngIf="newPassword.touched && newPassword.invalid">
          Password must start with a capital letter, include letters, numbers & special characters (min 8 chars)
        </small>
      </div>

      <!-- Confirm New Password -->
      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          #confirmPassword="ngModel"
          required
          minlength="8"
          pattern="^[A-Z](?=.*[a-zA-Z])(?=.*[0-9])(?=.*[@$!%*?&])[A-Za-z0-9@$!%*?&]{7,}$"
          [(ngModel)]="model.ConfirmPassword"
          placeholder="Confirm new password"
        />
        <small class="error"
               *ngIf="confirmPassword.touched && (model.NewPassword !== model.ConfirmPassword || confirmPassword.invalid)">
          Passwords do not match or invalid
        </small>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        [disabled]="
          !form.valid ||
          model.NewPassword !== model.ConfirmPassword
        ">
        Change Password
      </button>
    </form>
  </div>
</div>
