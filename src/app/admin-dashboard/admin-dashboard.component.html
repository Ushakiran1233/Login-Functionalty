<div class="layout">

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar">
    <h2 class="logo">RoadResQ</h2>

    <ul class="menu">

      <!-- ================= DASHBOARD ================= -->
      <li
        (click)="toggleSection('dashboard')"
        [class.active]="activeSection === 'dashboard'"
        [class.open]="activeSection === 'dashboard'">

        📊 Dashboard
        <span class="arrow" [class.rotate]="showSubmenu">▶</span>

        <!-- ================= SECURITY ACCESS ================= -->
        <ul *ngIf="showSubmenu && hasSecurityAccess">

          <li
            (click)="toggleSubSection('securityAccess'); $event.stopPropagation()"
            [class.active]="activeSubSection === 'securityAccess'"
            [class.open]="activeSubSection === 'securityAccess'">

            🔒 Security Access
            <span
              class="arrow"
              [class.rotate]="activeSubSection === 'securityAccess'">
              ▶
            </span>

            <ul>

              <li
                *ngIf="canAccess('ViewUsers')"
                (click)="navigateTo('users'); $event.stopPropagation()"
                [class.active]="isActive('users')">
                👥 Users
              </li>

              <li
                *ngIf="canAccess('ViewRoles')"
                (click)="navigateTo('roles'); $event.stopPropagation()"
                [class.active]="isActive('roles')">
                🛡️ Roles
              </li>

            </ul>
          </li>

        </ul>
      </li>

      <!-- ================= REPORTS ================= -->
      <li
        (click)="navigateTo('reports')"
        [class.active]="isActive('reports')">
        📄 Reports
      </li>

      <!-- ================= SETTINGS ================= -->
      <li
        (click)="navigateTo('settings')"
        [class.active]="isActive('settings')">
        ⚙️ Settings
      </li>

    </ul>
  </aside>

  <!-- ================= MAIN CONTENT ================= -->
  <div class="content">

    <!-- ================= TOP BAR ================= -->
    <header class="topbar">
      <h3>Admin Dashboard</h3>
      <p *ngIf="adminName">Welcome, {{ adminName }}!</p>

      <div class="profile-wrapper" #profileBox>
        <div class="profile" (click)="toggleProfile()">
          {{ adminName.charAt(0) }}
        </div>

        <div class="profile-card" *ngIf="showProfile">
          <h4>Profile</h4>

          <p><strong>Name:</strong> {{ adminName }}</p>
          <p><strong>Role:</strong> {{ adminRole }}</p>

          <button routerLink="/change-password">Change Password</button>
          <button (click)="logout()">Logout</button>
        </div>
      </div>
    </header>

    <!-- ================= PAGE BODY ================= -->
    <main class="page-body">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
