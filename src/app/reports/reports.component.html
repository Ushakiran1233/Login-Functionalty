<div class="reports-section">
  <h2>Reports</h2>

  <!-- Totals -->
  <div *ngIf="reports; else noReports">
    <p><strong>Total Users:</strong> {{ reports.totalUsers }}</p>
    <p><strong>Users with Mobile:</strong> {{ reports.usersWithMobile }}</p>

    <!-- Users by Role -->
    <div *ngIf="reports.usersByRole && getRoles().length > 0">
      <h3>Users by Role:</h3>
      <ul>
        <li *ngFor="let role of getRoles()">
          {{ role }}: {{ reports.usersByRole[role] }}
        </li>
      </ul>
    </div>

    <!-- Recent Users -->
    <div *ngIf="reports.recentUsers?.length">
      <h3>Recent Users:</h3>
      <table border="1" cellpadding="5">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let u of reports.recentUsers">
            <td>{{ u.userName }}</td>
            <td>{{ u.email }}</td>
            <td>{{ u.phoneNumber || '-' }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <ng-template #noReports>
    <p>No reports available.</p>
  </ng-template>
</div>
