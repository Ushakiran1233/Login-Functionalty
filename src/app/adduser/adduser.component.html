<div class="card add-user-card">
  <h3>Add User</h3>
  <span class="required-note">* Required</span>

  <!-- Name -->
  <div class="row">
    <div class="form-group full">
      <label>Name *</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="user.name"
        placeholder="Enter Name" />
    </div>
  </div>

  <!-- Email & Mobile -->
  <div class="row">
    <div class="form-group">
      <label>Email *</label>
      <input
        type="email"
        class="form-control"
        [(ngModel)]="user.email"
        placeholder="Enter Email" />
    </div>

    <div class="form-group">
      <label>Mobile No *</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="user.mobileNumber"
        placeholder="Enter Mobile Number" />
    </div>
  </div>

  <!-- Password -->
  <div class="row">
    <div class="form-group">
      <label>Password *</label>
      <input
        type="password"
        class="form-control"
        [(ngModel)]="user.password"
        placeholder="Enter Password" />
    </div>

    <div class="form-group">
      <label>Confirm Password *</label>
      <input
        type="password"
        class="form-control"
        [(ngModel)]="user.confirmPassword"
        placeholder="Confirm Password" />
    </div>
  </div>

  <!-- Role & Status -->
  <div class="row">
    <div class="form-group">
      <label>Role *</label>
      <select class="form-control" [(ngModel)]="user.role">
        <option value="">Select Role</option>
        <option *ngFor="let r of roles" [value]="r.roleCode">
          {{ r.roleName }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label>Status</label>
      <select class="form-control" [(ngModel)]="user.isActive">
        <option [ngValue]="true">Active</option>
        <option [ngValue]="false">Inactive</option>
      </select>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn btn-danger" routerLink="/users">❌ Cancel</button>
    <button class="btn btn-success" (click)="saveUser()">✔ Save</button>
  </div>
</div>
