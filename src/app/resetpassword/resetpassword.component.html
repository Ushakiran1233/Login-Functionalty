<div class="auth-card">
  <h3>Reset Password</h3>

  <form #form="ngForm" novalidate>

    <!-- Email (readonly – from reset link) -->
    <label>Email Address</label>
    <input
      type="email"
      name="email"
      [(ngModel)]="model.email"
      readonly
      required
      style="font-weight: bold; background-color: #f0f0f0; cursor: not-allowed;"
    />

    <!-- New Password -->
   <!-- New Password -->
<label>New Password</label>
<input
  type="password"
  name="newPassword"
  #newPassword="ngModel"
  [(ngModel)]="model.newPassword"
  placeholder="New Password"
  required
  minlength="8"
  pattern="^[A-Z][A-Za-z0-9@$!%*?&]{7,}$"
  (keydown.space)="$event.preventDefault()"
/>
<small class="error"
       *ngIf="newPassword.touched && newPassword.invalid">
  Password must start with a capital letter, include letters, numbers & special character, minimum 8 characters
</small>


    <!-- Confirm Password -->
    <label>Confirm Password</label>
    <input
      type="password"
      name="confirmPassword"
      #confirmPassword="ngModel"
      [(ngModel)]="model.confirmPassword"
      placeholder="Confirm Password"
      required
      (keydown.space)="$event.preventDefault()"
    />
    <small class="error"
           *ngIf="confirmPassword.touched && model.newPassword !== model.confirmPassword">
      Passwords do not match
    </small>

    <!-- Reset Button -->
    <button
      type="button"
      (click)="resetPassword()"
      [disabled]="!form.valid || model.newPassword !== model.confirmPassword">
      Reset Password
    </button>

  </form>
</div>
