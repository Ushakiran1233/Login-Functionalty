<div class="auth-card">
  <h3>Reset Password</h3>

  <form #form="ngForm" novalidate>

    <!-- Email -->
    <label>
      Email Address <span class="required">*</span>
    </label>
    <input
      type="email"
      name="email"
      [(ngModel)]="model.email"
      readonly
      required
      style="font-weight: bold; background-color: #f0f0f0; cursor: not-allowed;"
    />

    <!-- New Password -->
    <label>
      New Password <span class="required">*</span>
    </label>
    <input
      type="password"
      name="newPassword"
      #newPassword="ngModel"
      [(ngModel)]="model.newPassword"
      placeholder="New Password"
      required
      minlength="8"
      pattern="^[A-Za-z0-9@$!%*?&]+$"
      (keydown.space)="$event.preventDefault()"
    />

    <!-- REQUIRED -->
    <small class="error"
           *ngIf="newPassword.touched && newPassword.errors?.['required']">
      Password is required
    </small>

    <!-- MIN LENGTH -->
    <small class="error"
           *ngIf="newPassword.touched && newPassword.errors?.['minlength']">
      Password must be at least 8 characters long
    </small>

    <!-- ALLOWED CHARACTERS -->
    <small class="error"
           *ngIf="newPassword.touched && newPassword.errors?.['pattern']">
      Password can contain letters, numbers, and special characters only
    </small>

    <!-- Confirm Password -->
    <label>
      Confirm Password <span class="required">*</span>
    </label>
    <input
      type="password"
      name="confirmPassword"
      #confirmPassword="ngModel"
      [(ngModel)]="model.confirmPassword"
      placeholder="Confirm Password"
      required
      (keydown.space)="$event.preventDefault()"
    />

    <small class="error"
           *ngIf="confirmPassword.touched && model.newPassword !== model.confirmPassword">
      Passwords do not match
    </small>

    <!-- Reset Button -->
    <button
      type="button"
      (click)="resetPassword()"
      [disabled]="!form.valid || model.newPassword !== model.confirmPassword">
      Reset Password
    </button>

  </form>
</div>
