<div class="card add-role-card">
  <h3>Roles</h3>

  <div class="add-role-wrapper">
    <input
      type="text"
      class="form-control"
      placeholder="Search roles"
      [(ngModel)]="roleSearch"
      (input)="filterRoles()" />

    <button class="btn btn-secondary" (click)="addRole()">
      ➕ Add Role
    </button>
  </div>
</div>

<!-- ================= ROLES TABLE ================= -->
<table class="table table-hover user-table">
  <thead>
    <tr>
      <th>Role ID</th>
      <th>Role Name</th>
      <th>Description</th>
      <th>Status</th>
      <th style="width:160px">Actions</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let role of filteredRoles">
      <td>{{ role.roleId }}</td>
      <td>{{ role.name }}</td>
      <td>{{ role.description }}</td>
      <td>
        <span
          class="status-text"
          [class.active]="role.isActive"
          [class.inactive]="!role.isActive">
          {{ role.isActive ? 'Active' : 'Inactive' }}
        </span>
      </td>
      <td class="actions">
        <button class="btn btn-sm btn-primary" (click)="editRole(role)">
          ✏️ Edit
        </button>
        <button class="btn btn-sm btn-danger" (click)="deleteRole(role.roleId)">
          🗑️ Delete
        </button>
      </td>
    </tr>
  </tbody>
</table>

<!-- ================= ADD / EDIT ROLE MODAL ================= -->
<div class="modal-overlay" *ngIf="showRoleForm">
  <div class="modal-card large permission-modal">

    <!-- HEADER -->
    <div class="modal-header">
      <h3>{{ editingRoleId ? 'Edit Role' : 'Add Role' }}</h3>
      <span class="required-note">* Required</span>
    </div>

    <!-- BODY -->
    <div class="modal-body">

      <div class="row">

        <!-- ROLE NAME -->
        <div class="form-group">
          <label>Role Name *</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="roleFormData.name"
            name="roleName"
            placeholder="Enter role name" />
        </div>

        <!-- STATUS -->
        <div class="form-group">
          <label>Status</label>
          <select
            class="form-control"
            [(ngModel)]="roleFormData.isActive"
            name="status">
            <option [ngValue]="true">Active</option>
            <option [ngValue]="false">Inactive</option>
          </select>
        </div>

      </div>

      <!-- DESCRIPTION -->
      <div class="form-group full">
        <label>Description</label>
        <textarea
          class="form-control"
          rows="3"
          [(ngModel)]="roleFormData.description"
          name="description">
        </textarea>
      </div>

      <!-- PERMISSIONS (SHOW ON ADD & EDIT) -->
      <div
        class="permission-box"
        *ngIf="permissionGroups?.length">

        <h4>Assign Permissions</h4>

        <div
          class="permission-group"
          *ngFor="let group of permissionGroups">

          <div
            class="group-header"
            (click)="group.expanded = !group.expanded">
            <span>{{ group.groupName }}</span>
            <span>{{ group.expanded ? '▾' : '▸' }}</span>
          </div>

          <div class="group-items" *ngIf="group.expanded">

            <label
              class="permission-item"
              *ngFor="let perm of group.permissions">

              <input
                type="checkbox"
                [(ngModel)]="perm.selected"
                [ngModelOptions]="{ standalone: true }" />

              <span>{{ perm.activityName }}</span>
            </label>

          </div>
        </div>

      </div>

    </div>

    <!-- FOOTER -->
    <div class="modal-footer actions">
      <button class="btn btn-danger" (click)="cancelEdit()">❌ Cancel</button>
      <button class="btn btn-success" (click)="saveRole()">✔ Save</button>
    </div>

  </div>
</div>
