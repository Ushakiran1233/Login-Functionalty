<div class="card add-role-card">
  <h3>Roles</h3>

  <!-- Search/filter -->
  <div class="add-role-wrapper">
    <input
      type="text"
      class="form-control"
      placeholder="Search roles"
      [(ngModel)]="roleSearch"
      (input)="filterRoles()" />

    <button class="btn btn-secondary" (click)="addRole()">
      ➕ Add Role
    </button>
  </div>
</div>

<!-- Roles Table -->
<table class="table table-hover user-table">
  <thead>
    <tr>
      <th>Role ID</th>
      <th>Role Name</th>
      <th>Description</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let role of filteredRoles">
      <td>{{ role.roleId }}</td>
      <td>{{ role.name }}</td>
      <td>{{ role.description }}</td>
      <td>
        <span
          class="status-text"
          [class.active]="role.isActive"
          [class.inactive]="!role.isActive">
          {{ role.isActive ? 'Active' : 'Inactive' }}
        </span>
      </td>
      <td class="actions">
        <button
          class="primary"
          (click)="editRole(role)">
          ✏️ Edit
        </button>
        <button
          class="danger"
          (click)="deleteRole(role.roleId)">
          🗑️ Delete
        </button>
      </td>
    </tr>
  </tbody>
</table>

<!-- Add/Edit Role Modal -->
<div class="modal-overlay" *ngIf="showRoleForm">
  <div class="modal-card">
    <h3>{{ roleFormData.roleId ? 'Edit Role' : 'Add Role' }}</h3>
    <span class="required-note">* Required</span>

    <!-- Role Name -->
    <div class="form-group">
      <label>Role Name *</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="roleFormData.name"
        placeholder="Enter Role Name" />
    </div>

    <!-- Description -->
    <div class="form-group">
      <label>Description</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="roleFormData.description"
        placeholder="Enter Description" />
    </div>

    <!-- Status -->
    <div class="form-group">
      <label>Status</label>
      <select
        class="form-control"
        [(ngModel)]="roleFormData.isActive">
        <option [ngValue]="true">Active</option>
        <option [ngValue]="false">Inactive</option>
      </select>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn btn-danger" (click)="cancelEdit()">❌ Cancel</button>
      <button class="btn btn-success" (click)="saveRole()">✔ Save</button>
    </div>
  </div>
</div>
